name: checks
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: build
        env:
          # /sign-in is prerendered at build and constructs a Supabase browser
          # client, which requires these publishable values to be present.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build
      - run: pnpm exec prettier --check .

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm test:rls

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm supabase start
      - name: run
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          FALLBACK_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Use the anon key from the running local stack; fall back to the
          # publishable-key secret so the dev server always boots. Authenticated
          # e2e tests self-skip when SUPABASE_SERVICE_ROLE_KEY is unset (it is here).
          KEY="$(pnpm exec supabase status -o env 2>/dev/null | sed -n 's/^ANON_KEY=//p' | tr -d '"')"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${KEY:-$FALLBACK_ANON_KEY}"
          pnpm test:e2e
